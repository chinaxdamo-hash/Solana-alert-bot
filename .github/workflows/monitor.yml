
name: Solana Alert Bot

on:
  schedule:
    - cron: "7-59/5 * * * *"

  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send one test message to Telegram"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: solana-alert-bot
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '0' }}
        run: python bot.py

      - name: Save all bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            seen_events.json \
            initialized_sources.json \
            paper_trades.json \
            paper_seen.json \
            paper_stats_date.json
          do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Update bot state"
            git push
          fi
